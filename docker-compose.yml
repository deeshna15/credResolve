services:
  smartdialer-ui:
    build: .
    container_name: smartdialer-ui
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  smartdialer-api:
    build: .
    container_name: smartdialer-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
